services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: groundline
      POSTGRES_USER: groundline
      POSTGRES_PASSWORD: groundline
    ports:
      - "55432:5432"
    volumes:
      - groundline-postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundline -d groundline"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    command: redis-stack-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  groundline-postgres:
